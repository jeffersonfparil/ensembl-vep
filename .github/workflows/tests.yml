name: Experimental Rust-Python implementation of VEP

# Trigger the tests whenever code is pushed or a pull request is opened
on:
  push:
    branches: "rust-python-hybrid"
  pull_request:
    branches: "rust-python-hybrid"

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # If one OS fails, let the others finish
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Test against the most common modern Python versions
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # This action automatically handles Rust caching so your CI doesn't take 10 minutes to compile!

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Instructs uv to read your uv.lock and set up the exact environment
          uv sync --all-extras --dev

      - name: Compile the Rust Core
        run: |
          # Replicate your local workflow exactly
          uv run maturin develop

      - name: Run pytest
        run: |
          # Fire the tests!
          uv run pytest tests/ -v